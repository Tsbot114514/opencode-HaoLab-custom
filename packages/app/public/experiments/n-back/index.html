<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2-back 工作记忆任务</title>
    <style>
      :root{color-scheme:light;--ink:#17262d;--muted:#69767a;--paper:#f3f0e8;--panel:#fffdf8;--line:#d8d2c6;--accent:#b34b38}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",sans-serif}button{font:inherit}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}header,footer{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-color:var(--line)}header{border-bottom:1px solid var(--line)}footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.progress{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}main{display:grid;place-items:center;padding:30px}.screen{display:none;width:min(720px,100%)}.screen.active{display:block}h1{margin:14px 0 16px;font:600 clamp(34px,6vw,64px)/1.05 Georgia,"SimSun",serif;letter-spacing:-.03em}.lead{max-width:610px;font-size:16px;line-height:1.8;color:var(--muted)}.example{margin:28px 0;display:flex;align-items:center;gap:10px}.example span{display:grid;place-items:center;width:54px;height:60px;border:1px solid var(--line);background:var(--panel);font:600 27px Georgia,serif}.example i{color:var(--muted);font-style:normal}.primary,.secondary{padding:11px 18px;border:1px solid var(--ink);cursor:pointer}.primary{background:var(--ink);color:white}.secondary{background:transparent;color:var(--ink)}
      .task{text-align:center}.stimulus{height:300px;display:grid;place-items:center;font:600 clamp(100px,18vw,190px)/1 Georgia,serif}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:62px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}.answer:hover{border-color:var(--ink)}.answer kbd{display:inline-grid;place-items:center;min-width:28px;height:24px;margin-right:8px;padding:0 5px;border:1px solid var(--line);background:white;font:12px monospace}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:28px 0;border:1px solid var(--line);background:var(--line)}.metric{padding:22px;background:var(--panel)}.metric strong{display:block;font:600 30px Georgia,serif}.metric span{font-size:12px;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.note{margin-top:24px;font-size:12px;line-height:1.6;color:var(--muted)}@media(max-width:640px){header,footer{padding:14px 18px}.metric-grid{grid-template-columns:1fr}main{padding:22px}.stimulus{height:240px}}
    </style>
  </head>
  <body>
    <div class="shell">
      <header><div><div class="eyebrow">HaoLab · Working memory</div><strong>2-back 工作记忆任务</strong></div><div class="progress" id="progress">准备</div></header>
      <main>
        <section class="screen active" id="intro"><div class="eyebrow">任务说明</div><h1>它和前两个一样吗？</h1><p class="lead">字母会依次出现。请判断当前字母是否与前面第 2 个字母相同。前两题没有可比较对象，只需观察。</p><div class="example"><span>A</span><span>B</span><span>A</span><i>第三个 A 与前面第 2 个相同，应选择「匹配」</i></div><button class="primary" id="start">开始实验</button></section>
        <section class="screen task" id="task"><div class="stimulus" id="stimulus">+</div><div class="answers"><button class="answer" data-response="match"><kbd>空格</kbd>匹配</button><button class="answer" data-response="different"><kbd>N</kbd>不匹配</button></div></section>
        <section class="screen" id="results"><div class="eyebrow">实验完成</div><h1>本次工作记忆结果</h1><div class="metric-grid"><div class="metric"><strong id="accuracy">--</strong><span>判断正确率</span></div><div class="metric"><strong id="meanRt">--</strong><span>平均反应时</span></div><div class="metric"><strong id="misses">--</strong><span>未作答</span></div></div><div class="actions"><button class="primary" id="download">导出 CSV</button><button class="secondary" id="restart">再做一次</button></div><p class="note">这是简化的 2-back 演示。正式研究应进一步控制目标比例、刺激序列、练习标准和反应窗口。</p></section>
      </main>
      <footer><span>空格表示匹配，N 表示不匹配。</span><span id="status">尚未开始</span></footer>
    </div>
    <script>
      const letters=["A","B","C","D","E","F","G","H"]
      const screens=[...document.querySelectorAll(".screen")]
      let sequence=[],results=[],index=0,startedAt=0,accepting=false,timer=0
      const show=(id)=>screens.forEach((screen)=>screen.classList.toggle("active",screen.id===id))
      function makeSequence(){const output=[];for(let i=0;i<16;i++){if(i>=2&&Math.random()<.32)output.push(output[i-2]);else{const blocked=i>=2?output[i-2]:"",options=letters.filter((letter)=>letter!==blocked);output.push(options[Math.floor(Math.random()*options.length)])}}return output}
      function start(){sequence=makeSequence();results=[];index=0;show("task");next()}
      function next(){
        clearTimeout(timer)
        if(index>=sequence.length)return finish()
        accepting=false;const stimulus=document.querySelector("#stimulus");stimulus.textContent="+";document.querySelector("#progress").textContent=`${index+1} / ${sequence.length}`;document.querySelector("#status").textContent=index<2?"请记住字母":"准备判断"
        setTimeout(()=>{stimulus.textContent=sequence[index];startedAt=performance.now();if(index<2){timer=setTimeout(()=>{results.push({trial:index+1,letter:sequence[index],target:"observe",response:"observe",correct:true,rt_ms:""});index+=1;next()},900);return}accepting=true;document.querySelector("#status").textContent="请作答";timer=setTimeout(()=>answer("none"),2500)},320)
      }
      function answer(response){if(!accepting)return;accepting=false;clearTimeout(timer);const target=sequence[index]===sequence[index-2]?"match":"different";results.push({trial:index+1,letter:sequence[index],target,response,correct:response===target,rt_ms:response==="none"?"":Math.round(performance.now()-startedAt)});index+=1;setTimeout(next,260)}
      function finish(){show("results");const scored=results.filter((row)=>row.target!=="observe"),correct=scored.filter((row)=>row.correct),times=scored.filter((row)=>row.rt_ms!=="").map((row)=>Number(row.rt_ms));document.querySelector("#accuracy").textContent=`${Math.round(correct.length/scored.length*100)}%`;document.querySelector("#meanRt").textContent=times.length?`${Math.round(times.reduce((a,b)=>a+b,0)/times.length)} ms`:"--";document.querySelector("#misses").textContent=String(scored.filter((row)=>row.response==="none").length);document.querySelector("#progress").textContent="完成";document.querySelector("#status").textContent="数据已就绪"}
      function download(){const fields=["trial","letter","target","response","correct","rt_ms"],csv=[fields.join(","),...results.map((row)=>fields.map((field)=>row[field]).join(","))].join("\n");const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));link.download=`2-back-${Date.now()}.csv`;link.click();URL.revokeObjectURL(link.href)}
      document.querySelector("#start").addEventListener("click",start);document.querySelector("#restart").addEventListener("click",start);document.querySelector("#download").addEventListener("click",download);document.querySelectorAll(".answer").forEach((button)=>button.addEventListener("click",()=>answer(button.dataset.response)));document.addEventListener("keydown",(event)=>{if(event.code==="Space"){event.preventDefault();answer("match")}if(event.key.toLowerCase()==="n")answer("different")})
    </script>
  </body>
</html>
