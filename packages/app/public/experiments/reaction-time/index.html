<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>简单反应时任务</title>
    <style>
      :root { color-scheme:light; --ink:#18262b; --muted:#6b7779; --paper:#f2efe7; --panel:#fffdf7; --line:#d7d1c3; --signal:#d84d36; }
      *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",sans-serif}button{font:inherit}
      .shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}header,footer{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-color:var(--line)}header{border-bottom:1px solid var(--line)}footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
      .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.progress{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}main{position:relative;display:grid;place-items:center;padding:30px}.screen{display:none;width:min(720px,100%)}.screen.active{display:block}
      h1{margin:14px 0 16px;font:600 clamp(34px,6vw,64px)/1.05 Georgia,"SimSun",serif;letter-spacing:-.03em}.lead{max-width:600px;font-size:16px;line-height:1.8;color:var(--muted)}.rules{margin:30px 0;padding:20px;border-block:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.rules b{display:block;font:600 23px Georgia,serif}.rules span{font-size:12px;color:var(--muted)}
      .primary,.secondary{padding:11px 18px;border:1px solid var(--ink);cursor:pointer}.primary{background:var(--ink);color:white}.secondary{background:transparent;color:var(--ink)}
      #stage{position:absolute;inset:0;display:none;place-items:center;cursor:crosshair;user-select:none}#stage.active{display:grid}.cue{text-align:center}.cue p{color:var(--muted);font-size:14px}.dot{width:min(23vw,180px);aspect-ratio:1;border-radius:50%;background:var(--signal);box-shadow:0 0 0 18px color-mix(in srgb,var(--signal) 10%,transparent);transform:scale(.7);opacity:0}.dot.visible{animation:arrive .14s ease-out forwards}@keyframes arrive{to{transform:scale(1);opacity:1}}
      .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:28px 0;border:1px solid var(--line);background:var(--line)}.metric{padding:22px;background:var(--panel)}.metric strong{display:block;font:600 30px Georgia,serif}.metric span{font-size:12px;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.note{margin-top:24px;font-size:12px;line-height:1.6;color:var(--muted)}
      @media(max-width:640px){header,footer{padding:14px 18px}.rules,.metric-grid{grid-template-columns:1fr}main{padding:22px}}
    </style>
  </head>
  <body>
    <div class="shell">
      <header><div><div class="eyebrow">HaoLab · Response task</div><strong>简单反应时任务</strong></div><div class="progress" id="progress">准备</div></header>
      <main>
        <section class="screen active" id="intro"><div class="eyebrow">任务说明</div><h1>看到信号，立即作答。</h1><p class="lead">每轮开始后请等待红色圆点出现。看到圆点时，立即按空格键或点击圆点。不要提前作答。</p><div class="rules"><div><b>5</b><span>有效试次</span></div><div><b>0.6–1.8 s</b><span>随机等待时间</span></div><div><b>约 1 min</b><span>预计用时</span></div></div><button class="primary" id="start">开始实验</button></section>
        <section class="screen" id="results"><div class="eyebrow">实验完成</div><h1>本次反应时结果</h1><div class="metric-grid"><div class="metric"><strong id="mean">--</strong><span>平均反应时</span></div><div class="metric"><strong id="fastest">--</strong><span>最快反应时</span></div><div class="metric"><strong id="falseStarts">--</strong><span>提前作答</span></div></div><div class="actions"><button class="primary" id="download">导出 CSV</button><button class="secondary" id="restart">再做一次</button></div><p class="note">设备、浏览器刷新率和输入方式都会影响结果。本页面仅用于容器演示，不用于临床或诊断判断。</p></section>
        <section id="stage"><div class="cue"><div class="dot" id="dot"></div><p id="instruction">请等待信号</p></div></section>
      </main>
      <footer><span>建议使用键盘空格键，并保持输入方式一致。</span><span id="status">尚未开始</span></footer>
    </div>
    <script>
      const total = 5
      let results = [], trial = 0, phase = "idle", signalAt = 0, timer = 0, falseStarts = 0
      const stage = document.querySelector("#stage"), dot = document.querySelector("#dot"), instruction = document.querySelector("#instruction")
      const screens = [...document.querySelectorAll(".screen")]
      const show = (id) => screens.forEach((screen) => screen.classList.toggle("active", screen.id === id))
      function start(){ results=[];trial=0;falseStarts=0;show("");stage.classList.add("active");next() }
      function next(){
        if(trial>=total)return finish()
        phase="waiting";dot.classList.remove("visible");instruction.textContent="请等待信号";document.querySelector("#progress").textContent=`${trial+1} / ${total}`;document.querySelector("#status").textContent="等待中"
        timer=setTimeout(()=>{phase="signal";signalAt=performance.now();dot.classList.add("visible");instruction.textContent="现在！";document.querySelector("#status").textContent="请立即作答"},600+Math.random()*1200)
      }
      function respond(){
        if(phase==="waiting"){clearTimeout(timer);falseStarts+=1;phase="feedback";instruction.textContent="太早了，请重新等待";document.querySelector("#status").textContent="提前作答";setTimeout(next,700);return}
        if(phase!=="signal")return
        const rt=Math.round(performance.now()-signalAt);phase="feedback";results.push({trial:trial+1,rt_ms:rt});trial+=1;dot.classList.remove("visible");instruction.textContent=`${rt} ms`;document.querySelector("#status").textContent="已记录";setTimeout(next,700)
      }
      function finish(){stage.classList.remove("active");show("results");phase="done";const times=results.map((row)=>row.rt_ms);document.querySelector("#mean").textContent=`${Math.round(times.reduce((a,b)=>a+b,0)/times.length)} ms`;document.querySelector("#fastest").textContent=`${Math.min(...times)} ms`;document.querySelector("#falseStarts").textContent=String(falseStarts);document.querySelector("#progress").textContent="完成";document.querySelector("#status").textContent="数据已就绪"}
      function download(){const csv=["trial,rt_ms",...results.map((row)=>`${row.trial},${row.rt_ms}`)].join("\n");const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));link.download=`reaction-time-${Date.now()}.csv`;link.click();URL.revokeObjectURL(link.href)}
      document.querySelector("#start").addEventListener("click",start);document.querySelector("#restart").addEventListener("click",start);document.querySelector("#download").addEventListener("click",download);stage.addEventListener("click",respond);document.addEventListener("keydown",(event)=>{if(event.code==="Space"){event.preventDefault();respond()}})
    </script>
  </body>
</html>
